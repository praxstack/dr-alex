[project]
name = "dr-alex"
version = "0.1.0"
description = "Dr. Alex Morgan — a warm, safe terminal therapy-support companion (Phase 1: TUI + deterministic safety shell)."
requires-python = ">=3.12"
authors = [{ name = "Prax", email = "prax.sr.sde@gmail.com" }]
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
]

[project.scripts]
dr-alex = "dr_alex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dr_alex", "safety", "books"]

[tool.hatch.build.targets.wheel.force-include]
"persona" = "dr_alex/_bundled/persona"
"data" = "dr_alex/_bundled/data"
"config.toml" = "dr_alex/_bundled/config.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
