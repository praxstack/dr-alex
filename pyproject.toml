[project]
name = "dr-alex"
version = "0.1.0"
description = "Dr. Alex Morgan — a warm, safe terminal therapy-support companion (Phase 1: TUI + deterministic safety shell)."
requires-python = ">=3.12"
authors = [{ name = "Prax", email = "prax.sr.sde@gmail.com" }]
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "keyring>=25.7.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    # Phase 6: the thin typed Notion mirror client (a real httpx client, NOT an MCP server —
    # council D2/D4: smaller attack surface). Also underpins the FastAPI TestClient.
    "httpx>=0.28.1",
]

[project.scripts]
dr-alex = "dr_alex.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dr_alex", "safety", "books"]
# The PWA ("The Room") static assets are shipped inside the package so alexd can serve them
# from the installed wheel exactly as from the source tree.
artifacts = ["dr_alex/room/*"]

[tool.hatch.build.targets.wheel.force-include]
"persona" = "dr_alex/_bundled/persona"
"data" = "dr_alex/_bundled/data"
"config.toml" = "dr_alex/_bundled/config.toml"
"dr_alex/room" = "dr_alex/room"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
