[project]
name = "dr-alex"
version = "0.1.0"
description = "Dr. Alex Morgan — a warm, safe terminal therapy-support companion (Phase 1: TUI + deterministic safety shell)."
requires-python = ">=3.12"
authors = [{ name = "Prax", email = "prax.sr.sde@gmail.com" }]
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "keyring>=25.7.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    # Phase 6: the thin typed Notion mirror client (a real httpx client, NOT an MCP server —
    # council D2/D4: smaller attack surface). Also underpins the FastAPI TestClient.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Phase 2b (drop-in books): PDF text extraction via PyMuPDF — a fast, fully-offline
# ~20MB binary wheel (no model download, no torch). OPTIONAL: .txt/.md books work
# without it, and a dropped PDF prints a one-line install hint rather than crashing.
pdf = ["pymupdf>=1.24"]

[project.scripts]
dr-alex = "dr_alex.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    # Phase 2b: exercise the REAL PDF extraction path in the suite (round-trips a tiny
    # synthetic PDF). Mirrors the optional-dependencies 'pdf' extra.
    "pymupdf>=1.24",
    # D16: lint + format + type-check for a safety-critical codebase.
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dr_alex", "safety", "books"]
# The PWA ("The Room") static assets are shipped inside the package so alexd can serve them
# from the installed wheel exactly as from the source tree.
artifacts = ["dr_alex/room/*"]

[tool.hatch.build.targets.wheel.force-include]
"persona" = "dr_alex/_bundled/persona"
"data" = "dr_alex/_bundled/data"
"config.toml" = "dr_alex/_bundled/config.toml"
"dr_alex/room" = "dr_alex/room"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# Lint + format + type-check (D16). Run: `uv run ruff check`, `uv run ruff format`,
# `uv run mypy dr_alex safety books`. The suite (`uv run pytest -q`) remains the
# primary gate; these add a static floor. Formatting is opt-in (line-length matches the
# existing ~100-col style) so it never explodes the diff.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "dr_alex/_bundled"]

[tool.ruff.lint]
# A bounded, high-signal rule set — not a maximalist campaign. E/F (pyflakes+pycodestyle),
# I (import sort), B (bugbear), UP (pyupgrade), SIM (simplify), N (naming), C4 (comprehensions).
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI Depends()/Header() in defaults is idiomatic
    "SIM105",  # try/except/pass is intentional in the fail-safe telemetry paths
    "E402",    # several modules intentionally lazy/local-import to avoid import cycles
    "N818",    # renaming the custom exceptions (…Refused/…Error) is an API change, out of scope
    "UP042",   # safety.Tier is a deliberate (str, Enum); not migrating to StrEnum here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]  # test helpers use non-PEP8 names freely

[tool.mypy]
python_version = "3.12"
files = ["dr_alex", "safety", "books"]
exclude = "dr_alex/_bundled"
ignore_missing_imports = true
# Non-blocking floor: opt-in strictness. Ratchet toward the safety/ + gates modules first
# rather than a repo-wide type-annotation campaign.
warn_unused_ignores = false
check_untyped_defs = false
